<!doctype html>
<html lang="en-CA">
  <head>
    <script src="/js/gtag.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search — Buy Canadian</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">
          <span data-logo-mark></span>
          Buy Canadian
        </a>
        <form class="search-form" id="header-search">
          <label class="sr-only" for="search-q">Search products</label>
          <input
            id="search-q"
            name="q"
            type="search"
            placeholder="Search Canadian products…" />
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
      </div>
    </header>

    <main class="container">
      <div class="page-header">
        <h1 id="search-title">Search</h1>
      </div>
      <div id="status"></div>
      <div class="product-grid product-grid--listing" id="product-grid"></div>
      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" class="btn btn-secondary" id="load-more">
          Load more
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-disclaimer">
            <p>
              Search combines your terms with “made in Canada” or “fabriqué au
              Canada” catalog wording. Origin is not guaranteed. Checkout is on
              each merchant's site.
            </p>
          </div>
          <div class="footer-meta">
            <label for="ships-to">Ships to</label>
            <select id="ships-to">
              <option value="CA">Canada</option>
            </select>
            <p class="footer-nav">
              <a href="/about.html">About</a>&nbsp; · &nbsp;<a href="/faq.html"
                >FAQ</a
              >
            </p>
          </div>
        </div>
        <div class="footer-links">
          &copy; <span id="year">2026</span> Buy Canadian by
          <a href="https://bricks2clicks.online/" target="_blank"
            >Bricks2Clicks.Online</a
          >
        </div>
      </div>
    </footer>

    <script type="module" src="/js/webmcp.js"></script>
    <script type="module">
      import {
        fetchJson,
        initFooter,
        initSearchForm,
        mountLogoMark,
        renderProductGrid,
        showError,
        MAX_PRODUCTS,
        getShipsTo,
        withOriginPass,
        needsFrenchOriginPass,
      } from "/js/app.js";
      import {
        applyPageSeo,
        injectJsonLd,
        breadcrumbSchema,
        itemListSchema,
      } from "/js/seo.js";
      import {
        mergeListingProducts,
        readListing,
        searchListingKey,
        writeListing,
      } from "/js/listing-store.js";

      mountLogoMark();

      initSearchForm();
      initFooter();

      const params = new URLSearchParams(window.location.search);
      const q = params.get("q") || "";
      if (!q.trim()) {
        window.location.href = "/";
        throw new Error("missing q");
      }

      document.getElementById("search-q").value = q;
      document.getElementById("search-title").textContent = `Search: ${q}`;

      const pagePath = `/search.html?q=${encodeURIComponent(q)}`;
      applyPageSeo({
        title: `Search: ${q} — Buy Canadian`,
        description: `Live search results for “${q}” from Canadian Shopify merchants, including made-in-Canada catalog filter.`,
        path: pagePath,
        noindex: true,
      });
      injectJsonLd(
        breadcrumbSchema([
          { name: "Home", path: "/" },
          { name: `Search: ${q}`, path: pagePath },
        ]),
      );

      const statusEl = document.getElementById("status");
      const grid = document.getElementById("product-grid");
      const loadMoreWrap = document.getElementById("load-more-wrap");
      const loadMoreBtn = document.getElementById("load-more");

      let schemaInjected = false;
      let cursor = null;
      let totalLoaded = 0;
      let loading = false;
      let allProducts = [];
      let nextServerOrder = 0;
      let hasNextPage = false;
      const storeKey = searchListingKey(q, getShipsTo());

      function persistListing() {
        writeListing(storeKey, {
          products: allProducts,
          cursor,
          hasNextPage,
          nextServerOrder,
        });
      }

      function applyListingState() {
        totalLoaded = allProducts.length;
        renderProductGrid(grid, allProducts);
        if (allProducts.length && !schemaInjected) {
          injectJsonLd(itemListSchema(allProducts, `Search: ${q}`, pagePath));
          schemaInjected = true;
        }
        if (totalLoaded === 0) {
          statusEl.innerHTML =
            '<p class="status-message">No in-stock products matched your search.</p>';
        } else {
          statusEl.innerHTML = "";
        }
        loadMoreWrap.hidden = !(hasNextPage && totalLoaded < MAX_PRODUCTS);
      }

      function ingestPage(data, { updatePagination = true } = {}) {
        const merged = mergeListingProducts(
          allProducts,
          data.products,
          nextServerOrder,
        );
        allProducts = merged.products;
        nextServerOrder = merged.nextServerOrder;
        if (updatePagination) {
          cursor = data.pagination.cursor;
          hasNextPage = Boolean(data.pagination.hasNextPage);
        }
        persistListing();
        applyListingState();
      }

      async function loadPage() {
        if (loading) return;
        loading = true;
        loadMoreBtn.disabled = true;
        statusEl.innerHTML =
          totalLoaded === 0 ? '<div class="spinner"></div>' : "";

        const requestHadCursor = Boolean(cursor);
        let path = `/api/catalog/search?q=${encodeURIComponent(q)}&limit=50`;
        if (cursor) path += `&cursor=${encodeURIComponent(cursor)}`;

        try {
          const data = await fetchJson(withOriginPass(path, "en"));
          if (data.destinationBlocked) {
            showError(statusEl, data.message);
            loadMoreWrap.hidden = true;
            return;
          }

          ingestPage(data);

          if (needsFrenchOriginPass(data, requestHadCursor)) {
            try {
              const extra = await fetchJson(withOriginPass(path, "fr"));
              if (!extra.destinationBlocked && extra.products?.length) {
                ingestPage(extra, { updatePagination: false });
              }
            } catch (err) {
              if (allProducts.length === 0) {
                throw err;
              }
            }
          }
        } catch (err) {
          showError(statusEl, err.message);
        } finally {
          loading = false;
          loadMoreBtn.disabled = false;
        }
      }

      loadMoreBtn.addEventListener("click", loadPage);

      const cached = readListing(storeKey);
      if (cached) {
        allProducts = cached.products.map((p, i) => ({
          ...p,
          _order: p._order ?? i,
        }));
        cursor = cached.cursor ?? null;
        hasNextPage = Boolean(cached.hasNextPage);
        nextServerOrder = cached.nextServerOrder ?? allProducts.length;
        applyListingState();
      } else {
        loadPage();
      }
    </script>
  </body>
</html>
